name: Compact native engine experiment
on:
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install pinned NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Build experimental media engine
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: bash tools/build_compact_ffmpeg.sh '${{ matrix.abi }}'
      - uses: actions/upload-artifact@v4
        with:
          name: compact-engine-${{ matrix.abi }}
          path: native-out/
          if-no-files-found: error
