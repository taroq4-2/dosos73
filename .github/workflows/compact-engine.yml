name: Compact native engine experiment
on:
  push:
    branches: ['feature/reliable-download-platform']
    paths: ['tools/build_compact_ffmpeg.sh', '.github/workflows/compact-engine.yml']
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install assembler
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Install pinned NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Build experimental media engine
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: bash tools/build_compact_ffmpeg.sh '${{ matrix.abi }}'
      - uses: actions/upload-artifact@v4
        with:
          name: compact-engine-${{ matrix.abi }}
          path: native-out/
          if-no-files-found: error



  package:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: compact-engine-*
          merge-multiple: true
          path: compact-engines
      - name: Build and validate universal candidate
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease assembleRelease --console=plain
          python3 tools/assemble_compact_experiment.py app/build/outputs/apk/release/app-release-unsigned.apk compact-engines compact-universal-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 compact-universal-unsigned.apk compact-universal-aligned-unsigned.apk
          python3 -c "from pathlib import Path; p=Path('compact-universal-aligned-unsigned.apk'); print(p.stat().st_size); assert p.stat().st_size < 80000000"
          sha256sum compact-universal-aligned-unsigned.apk > compact-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: compact-universal-UNSIGNED-experiment
          path: |
            compact-universal-aligned-unsigned.apk
            compact-SHA256SUMS.txt
          if-no-files-found: error
