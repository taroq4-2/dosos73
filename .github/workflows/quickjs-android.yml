name: Pinned Android QuickJS
on:
  push:
    branches: ['runtime/quickjs-*']
    paths: ['tools/quickjs/**', '.github/workflows/quickjs-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and inspect the pinned QuickJS executable
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          curl --fail --location --http1.1 --retry 4 --retry-all-errors \
            --connect-timeout 25 --max-time 600 \
            https://dl.google.com/android/repository/android-ndk-r28c-linux.zip -o ndk.zip
          echo 'dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f  ndk.zip' | sha256sum --check
          unzip -q ndk.zip -d "$RUNNER_TEMP"
          python3 tools/quickjs/build_android.py --abi "$ABI" \
            --ndk "$RUNNER_TEMP/android-ndk-r28c" --output quickjs-out
          sha256sum ndk.zip > quickjs-out/ndk-archive-sha256.txt
          git rev-parse HEAD > quickjs-out/producer-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quickjs-android-${{ matrix.abi }}
          path: quickjs-out/
          if-no-files-found: error
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quickjs-android-x86_64
          path: quickjs-out/
      - name: Enable KVM and fetch the pinned EJS fixture inputs
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          curl --fail --silent --show-error --location --proto '=https' --retry 3 \
            --connect-timeout 25 --max-time 120 \
            https://files.pythonhosted.org/packages/e3/bd/520769863744b669440a924271a6159ddd82ad5ae26b4ac4d4b69e9f8d44/yt_dlp_ejs-0.8.0-py3-none-any.whl \
            -o ejs.whl
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            set -e
            python3 tools/quickjs/smoke_android.py quickjs-out/libqjs.so ejs.whl > quickjs-smoke.json
            cat quickjs-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quickjs-android-smoke-x86_64
          path: quickjs-smoke.json
          if-no-files-found: error
