name: Android native transport diagnostic
on:
  workflow_dispatch:
  push:
    branches: [fix/reliability-youtube]
    paths: ['.github/workflows/network-diagnostic.yml']
permissions:
  contents: read
jobs:
  public-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.os73.dosos73.LiveDownloadTest#mediaExtractorAndNativeDownload -Pandroid.testInstrumentationRunnerArguments.liveMedia=true --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-public-fixture-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
