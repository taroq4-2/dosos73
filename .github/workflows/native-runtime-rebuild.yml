name: Pinned Python native runtime rebuild
on:
  push:
    branches: ['runtime/**']
    paths: ['tools/*native*', '.github/workflows/native-runtime-rebuild.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {abi: arm64-v8a, arch: aarch64}
          - {abi: armeabi-v7a, arch: arm}
          - {abi: x86, arch: i686}
          - {abi: x86_64, arch: x86_64}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare exact source inputs and Android patches
        run: |
          mkdir -p native-evidence
          python3 tools/prepare_native_runtime.py native-trial | tee native-evidence/preparation.txt
          cp native-trial/preparation-proof.json native-evidence/
          cp tools/native-runtime-lock.json native-evidence/
      - name: Build pinned source dependency closure
        env:
          TERMUX_BUILDER_IMAGE_NAME: ghcr.io/termux/package-builder@sha256:e2de051a518d8b188c59c4a1ecf357d373b9ccf48d6c06d7681fdc3f61a77287
          CONTAINER_NAME: dosos-native-${{ matrix.arch }}
        run: |
          set -o pipefail
          curl --fail --location --http1.1 --retry 4 --retry-all-errors --retry-delay 3 \
            --connect-timeout 25 --max-time 600 \
            https://dl.google.com/android/repository/android-ndk-r28c-linux.zip -o native-trial/android-ndk.zip
          echo 'dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f  native-trial/android-ndk.zip' | sha256sum --check
          sha256sum native-trial/android-ndk.zip > native-evidence/ndk-archive-sha256.txt
          unzip -q native-trial/android-ndk.zip -d native-trial
          rm native-trial/android-ndk.zip
          docker run --detach --init --name "$CONTAINER_NAME" --tty \
            --volume "$PWD/native-trial/termux:/home/builder/termux-packages" \
            --volume "$PWD/native-trial/android-ndk-r28c:/home/builder/lib/android-ndk-r28c:ro" \
            --volume "$PWD/native-trial/sources/python.tar.xz:/tmp/native-python.tar.xz:ro" \
            --security-opt "seccomp=$PWD/native-trial/termux/scripts/profile.json" \
            "$TERMUX_BUILDER_IMAGE_NAME"
          docker exec "$CONTAINER_NAME" bash -lc '
            set -euo pipefail
            build_python="$HOME/native-build-python"
            mkdir -p "$build_python/src"
            tar -xJf /tmp/native-python.tar.xz --directory "$build_python/src" --strip-components=1
            cd "$build_python/src"
            ./configure --prefix="$build_python" --without-ensurepip
            make -j2
            make altinstall
            "$build_python/bin/python3.12" --version
          ' 2>&1 | tee native-evidence/build-python.log
          docker exec --env CI=true --workdir /home/builder/termux-packages "$CONTAINER_NAME" \
            env TERMUX_PKG_API_LEVEL=29 SOURCE_DATE_EPOCH=1793577600 TERMUX_PKG_MAKE_PROCESSES=2 \
            bash -c '
              export PATH="$HOME/native-build-python/bin:$PATH"
              exec ./build-package.sh -a "$1" -F python libc++
            ' _ '${{ matrix.arch }}' 2>&1 | tee native-evidence/build.log
      - name: Collect core runtime and enforce static parity
        env:
          CONTAINER_NAME: dosos-native-${{ matrix.arch }}
        run: |
          set -o pipefail
          docker exec "$CONTAINER_NAME" bash -lc 'cd /home/builder/termux-packages && python3 package_native_runtime.py --abi "${{ matrix.abi }}" --readelf "$HOME/lib/android-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"' | tee native-evidence/packaging.txt
          cp -r native-trial/termux/native-runtime-out native-evidence/
          docker exec -i --workdir /home/builder/termux-packages "$CONTAINER_NAME" \
            python3 - --abi '${{ matrix.abi }}' < tools/collect_native_runtime_inputs.py > native-evidence/source-receipt.json
          test -s native-evidence/source-receipt.json
          docker cp "$CONTAINER_NAME:/home/builder/.termux-build/python/build/config.log" native-evidence/target-python-config.log
          docker cp "$CONTAINER_NAME:/home/builder/.termux-build/python/build/pyconfig.h" native-evidence/target-python-pyconfig.h
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-core-candidate-${{ matrix.abi }}
          path: native-evidence/
          if-no-files-found: error
