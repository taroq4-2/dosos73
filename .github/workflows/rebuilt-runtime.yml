name: Source-built runtime verification
on:
  push:
    branches: ['release/production-readiness']
    paths:
      - '.github/workflows/rebuilt-runtime.yml'
      - 'tools/assemble_rebuilt_runtime.py'
      - 'tools/fetch_rebuilt_runtime.py'
      - 'tools/rebuilt-runtime-artifacts.json'
      - 'tools/test_rebuilt_runtime.py'
      - 'tools/assemble_restricted_quickjs.py'
      - 'tools/assemble_source_crypto.py'
      - 'tools/fetch_source_runtime_updates.py'
      - 'tools/source-runtime-update-artifacts.json'
      - 'app/build.gradle.kts'
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/src/androidTest/**'
  workflow_dispatch:
concurrency:
  group: rebuilt-runtime-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build matching debug app and instrumentation
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --console=plain
          python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Fetch verified native producer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/fetch_rebuilt_runtime.py "$RUNNER_TEMP/rebuilt-native"
          python3 tools/fetch_source_runtime_updates.py "$RUNNER_TEMP/runtime-updates"
      - name: Assemble source-built compact debug runtime
        run: |
          python3 tools/fetch_runtime_overrides.py "$RUNNER_TEMP/runtime-overrides"
          python3 tools/assemble_compact_experiment.py app/build/outputs/apk/debug/app-debug.apk . "$RUNNER_TEMP/compact-debug.apk" --python-only --runtime-overrides "$RUNNER_TEMP/runtime-overrides"
          source_run="$(python3 -c "import json; print(json.load(open('tools/rebuilt-runtime-artifacts.json'))['run_id'])")"
          source_sha="$(python3 -c "import json; print(json.load(open('tools/rebuilt-runtime-artifacts.json'))['producer'])")"
          ndk_tools="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 tools/assemble_rebuilt_runtime.py --apk "$RUNNER_TEMP/compact-debug.apk" --artifacts "$RUNNER_TEMP/rebuilt-native" --run-id "$source_run" --producer "$source_sha" --strip-tool "$ndk_tools/llvm-strip" --readelf-tool "$ndk_tools/llvm-readelf" --output "$RUNNER_TEMP/rebuilt-output"
          updated="$RUNNER_TEMP/runtime-updates"
          core_apk="$RUNNER_TEMP/rebuilt-output/release-unsigned.apk"
          patch_sha="$(python3 -c "import json; print(json.load(open('tools/source-runtime-update-artifacts.json'))['quickjs']['patch_sha256'])")"
          python3 tools/assemble_restricted_quickjs.py --apk "$core_apk" --builds "$updated/quickjs" --output "$RUNNER_TEMP/rebuilt-output/quickjs-unsigned.apk" --proof "$RUNNER_TEMP/rebuilt-output/quickjs-proof.json" --readelf "$ndk_tools/llvm-readelf" --patch-sha256 "$patch_sha"
          python3 tools/assemble_source_crypto.py --apk "$RUNNER_TEMP/rebuilt-output/quickjs-unsigned.apk" --receipt-baseline "$core_apk" --builds "$updated/crypto" --sdist "$updated/crypto/pycryptodomex-3.24.1.tar.gz" --output "$RUNNER_TEMP/rebuilt-output/updated-unsigned.apk" --proof "$RUNNER_TEMP/rebuilt-output/crypto-proof.json"
          python3 tools/audit_elf_alignment.py "$RUNNER_TEMP/rebuilt-output/updated-unsigned.apk" "$RUNNER_TEMP/rebuilt-output/elf-audit.json"
      - name: Sign only the disposable test pair
        run: |
          delivery="$RUNNER_TEMP/rebuilt-test-inputs"
          mkdir -p "$delivery"
          keytool -genkeypair -keystore "$RUNNER_TEMP/rebuilt-test-key.jks" -storepass android -keypass android -alias androiddebugkey -dname CN=Android -keyalg RSA -keysize 2048 -validity 10000
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 "$RUNNER_TEMP/rebuilt-output/updated-unsigned.apk" "$RUNNER_TEMP/rebuilt-debug-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/rebuilt-test-key.jks" --ks-key-alias androiddebugkey --ks-pass pass:android --out "$delivery/app.apk" "$RUNNER_TEMP/rebuilt-debug-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/rebuilt-test-key.jks" --ks-key-alias androiddebugkey --ks-pass pass:android --out "$delivery/tests.apk" app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$delivery/app.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$delivery/tests.apk"
          cp "$RUNNER_TEMP/rebuilt-output/integration-proof.json" "$delivery/integration-proof.json"
          cp "$RUNNER_TEMP/rebuilt-output/quickjs-proof.json" "$delivery/quickjs-proof.json"
          cp "$RUNNER_TEMP/rebuilt-output/crypto-proof.json" "$delivery/crypto-proof.json"
          cp "$RUNNER_TEMP/rebuilt-output/elf-audit.json" "$delivery/elf-audit.json"
          git rev-parse HEAD > "$delivery/source-commit.txt"
          (cd "$delivery" && sha256sum app.apk tests.apk integration-proof.json quickjs-proof.json crypto-proof.json elf-audit.json source-commit.txt > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuilt-runtime-test-inputs
          path: |
            ${{ runner.temp }}/rebuilt-test-inputs/app.apk
            ${{ runner.temp }}/rebuilt-test-inputs/tests.apk
            ${{ runner.temp }}/rebuilt-test-inputs/integration-proof.json
            ${{ runner.temp }}/rebuilt-test-inputs/quickjs-proof.json
            ${{ runner.temp }}/rebuilt-test-inputs/crypto-proof.json
            ${{ runner.temp }}/rebuilt-test-inputs/elf-audit.json
            ${{ runner.temp }}/rebuilt-test-inputs/source-commit.txt
            ${{ runner.temp }}/rebuilt-test-inputs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rebuilt-runtime-package-failure
          path: |
            app/build/reports/
            ${{ runner.temp }}/rebuilt-output/integration-proof.json
            ${{ runner.temp }}/rebuilt-output/quickjs-proof.json
            ${{ runner.temp }}/rebuilt-output/crypto-proof.json
            ${{ runner.temp }}/rebuilt-output/elf-audit.json
  devices:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 31, 32, 33, 34, 35, 36]
    steps:
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rebuilt-runtime-test-inputs
          path: rebuilt-delivery
      - name: Verify same-run test inputs
        working-directory: rebuilt-delivery
        run: sha256sum --check SHA256SUMS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Provision emulator SDK packages
        env:
          TEST_API: ${{ matrix.api }}
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          (set +o pipefail; yes | "$sdkmanager" --licenses >/dev/null)
          image="system-images;android-${TEST_API};default;x86_64"
          for attempt in 1 2 3; do
            if "$sdkmanager" --install platform-tools 'platforms;android-36' 'build-tools;35.0.0' emulator "$image" &&
              test -x "$ANDROID_HOME/emulator/emulator" &&
              test -s "$ANDROID_HOME/system-images/android-${TEST_API}/default/x86_64/system.img"; then
              exit 0
            fi
            echo "SDK package acquisition failed (attempt $attempt/3)." >&2
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disk-size: 4096M
          script: |
            adb install -t rebuilt-delivery/app.apk
            adb install -t rebuilt-delivery/tests.apk
            if [ "${{ matrix.api }}" -ge 33 ]; then adb shell pm grant com.os73.dosos73 android.permission.POST_NOTIFICATIONS; fi
            mkdir -p rebuilt-reports
            adb shell getprop ro.build.version.sdk > rebuilt-reports/api.txt
            adb shell getprop ro.product.cpu.abilist > rebuilt-reports/abis.txt
            adb shell getconf PAGE_SIZE > rebuilt-reports/page-size.txt
            adb shell am instrument -w -e requireSourceUpdates true com.os73.dosos73.test/androidx.test.runner.AndroidJUnitRunner | tee rebuilt-reports/instrumentation.txt
            python3 -c "from pathlib import Path; import re; text=Path('rebuilt-reports/instrumentation.txt').read_text(); assert re.search(r'(?m)^OK \([0-9]+ tests?\)$', text) and not any(marker in text for marker in ('FAILURES!!!', 'INSTRUMENTATION_FAILED', 'Process crashed')), 'Instrumentation did not pass'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rebuilt-runtime-api-${{ matrix.api }}
          path: rebuilt-reports/
          if-no-files-found: warn
