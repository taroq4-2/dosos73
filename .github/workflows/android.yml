name: Android verification
on:
  push:
    branches: [main, 'maintenance/**', 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --console=plain
      - name: Check APK integrity
        run: sha256sum app/build/outputs/apk/debug/*.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dosos73-development-apks-and-reports
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/
            SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-reports
          path: app/build/reports/
  device-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 33, 35, 36]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: |
            ./gradlew connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
