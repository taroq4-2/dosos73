name: Android verification
on:
  push:
    branches: [main, 'maintenance/**', 'feature/**', 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease bundleRelease exportRuntimeInventory verifyNoKapt --console=plain
      - name: Test release and advisory tools
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Fail closed on unreviewed Maven or Python advisories
        run: python3 tools/check_dependency_advisories.py --inventory app/build/reports/audit/runtime-components.json --output app/build/reports/audit/osv.json
      - name: Check build tool advisories and review preconditions
        run: python3 tools/check_build_advisories.py --output app/build/reports/audit/build-advisories.json
      - name: Validate bundle identity and ABI contents
        run: |
          python3 tools/fetch_bundletool.py /tmp/bundletool.jar
          python3 tools/verify_bundle.py --bundle app/build/outputs/bundle/release/app-release.aab --bundletool /tmp/bundletool.jar --version-code 15 --report app/build/reports/audit/bundle.json
      - name: Record build identity and integrity
        run: |
          git rev-parse HEAD > app/build/reports/audit/source-commit.txt
          git show -s --format=%ct HEAD > app/build/reports/audit/source-date-epoch.txt
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab > SHA256SUMS.txt
          printf '%s\n' 'CI artifacts are unsigned verification inputs. Production signing occurs outside CI; no public release is created.' > app/build/reports/audit/signing-status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dosos73-build-reports
          path: |
            app/build/reports/
            SHA256SUMS.txt
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: failure-reports
          path: app/build/reports/
  device-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 31, 32, 33, 34, 35, 36]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disk-size: 4096M
          script: |
            ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
            python3 tools/fetch_runtime_overrides.py /tmp/runtime-overrides
            python3 tools/assemble_compact_experiment.py app/build/outputs/apk/debug/app-debug.apk . /tmp/shared-unsigned.apk --python-only --runtime-overrides /tmp/runtime-overrides
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p 4 /tmp/shared-unsigned.apk /tmp/shared-aligned.apk
            keytool -genkeypair -keystore /tmp/dosos-ci.jks -storepass android -keypass android -alias androiddebugkey -dname CN=Android -keyalg RSA -keysize 2048 -validity 10000
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/dosos-ci.jks --ks-key-alias androiddebugkey --ks-pass pass:android --out /tmp/shared-debug.apk /tmp/shared-aligned.apk
            adb install -t /tmp/shared-debug.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/dosos-ci.jks --ks-key-alias androiddebugkey --ks-pass pass:android --out /tmp/shared-tests.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb install -t /tmp/shared-tests.apk
            if [ "${{ matrix.api }}" -ge 33 ]; then adb shell pm grant com.os73.dosos73 android.permission.POST_NOTIFICATIONS; fi
            mkdir -p app/build/reports/shared-device
            adb shell df -h /data | tee app/build/reports/shared-device/storage.txt
            adb shell am instrument -w com.os73.dosos73.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/reports/shared-device/instrumentation.txt
            test "$(tail -n 6 app/build/reports/shared-device/instrumentation.txt | tr -d '\r' | grep -E '^OK \([0-9]+ tests?\)$')" != ""
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: device-test-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/reports/shared-device/
