name: Exact signed APK acceptance
on:
  push:
    branches: ['maintenance/**']
    paths: ['.github/workflows/signed-acceptance.yml','tools/accept_signed_apk.py','tools/signed-candidate.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            target: default
            pages: 4096
          - api: 36
            target: google_apis_ps16k
            pages: 16384
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the pinned signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(python3 -c "import json; print(json.load(open('tools/signed-candidate.json'))['asset'])")
          [[ "$asset" =~ ^dosos73-1\.3\.2-[a-f0-9]+-universal\.apk$ ]]
          gh release download v1.3.2 --repo "$GITHUB_REPOSITORY" --pattern "$asset" --output /tmp/signed.apk
          digest=$(python3 -c "import json; print(json.load(open('tools/signed-candidate.json'))['sha256'])")
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  /tmp/signed.apk\n' "$digest" | sha256sum --check
          printf 'EXPECTED_SHA256=%s\n' "$digest" >> "$GITHUB_ENV"
      - name: Install host inspection tools and enable KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          script: python3 tools/accept_signed_apk.py --apk /tmp/signed.apk --sha256 "$EXPECTED_SHA256" --page-size ${{ matrix.pages }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: signed-acceptance-api-${{ matrix.api }}-${{ matrix.pages }}
          path: acceptance-evidence/
